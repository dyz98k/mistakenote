server:
  port: 8080

spring:
  datasource:
    # 通过环境变量注入，Docker Compose 中 mysql 服务名为 db
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:mistakenote}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4
      # 等待数据库就绪（MySQL 启动较慢）
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        connection:
          characterEncoding: utf8mb4
          useUnicode: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 生产环境：JWT 密钥通过环境变量注入，务必修改
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# AI 配置：API Key 通过环境变量注入
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  ark:
    api-key: ${ARK_API_KEY:}
    base-url: https://ark.cn-beijing.volces.com/api/v3
    vision-model: doubao-seed-2-0-lite-260428

# 上传文件存储路径（容器内）
upload:
  dir: /app/uploads

logging:
  level:
    com.example.mistakenote: INFO
    org.hibernate.SQL: WARN
