server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mistakenote?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        connection:
          characterEncoding: utf8mb4
          useUnicode: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-32chars}
  expiration: 86400000

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:sk-your-deepseek-api-key}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  ark:
    api-key: ${ARK_API_KEY:ark-your-ark-api-key}
    base-url: https://ark.cn-beijing.volces.com/api/v3
    vision-model: doubao-seed-2-0-lite-260428

logging:
  level:
    com.example.mistakenote: DEBUG
    org.hibernate.SQL: DEBUG
